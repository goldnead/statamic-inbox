<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #5E1F52 0%, #34102F 55%, #110410 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #F3D1E8; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #D77DBB; box-shadow: 0 0 18px #D77DBB; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#F3D1E8,#DE9CC9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #EADAE5; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #F3D1E8; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #A8558F47, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Inbox</span></h1>
      <p class="sub">Your mailbox as conversations in the Control Panel, linked to LeadHub contacts.</p>
      <div class="badges">
        <span class="badge">IMAP</span>
        <span class="badge">LeadHub contacts</span>
        <span class="badge">Own SMTP</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A8558F"/><stop offset="1" stop-color="#3D1236"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3D1236" flood-opacity="0.34"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- an inbox tray with a reply bubble, see icon.svg -->
        <g transform="translate(-14 8)">
        <g filter="url(#sh)">
          <rect x="98" y="168" width="300" height="232" rx="28" fill="#FFFFFF"/>
        </g>
        <rect x="134" y="208" width="132" height="22" rx="11" fill="url(#bg)"/>
        <rect x="134" y="254" width="104" height="22" rx="11" fill="url(#bg)"/>
        <path d="M122 310 H190 L208 344 H288 L306 310 H374" stroke="url(#bg)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M362 112 C400 112 426 136 426 166 C426 196 400 220 362 220 C353 220 344 219 336 216 L304 232 L312 204 C302 194 298 181 298 166 C298 136 324 112 362 112 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="36" stroke-linejoin="round"/>
        <path d="M362 112 C400 112 426 136 426 166 C426 196 400 220 362 220 C353 220 344 219 336 216 L304 232 L312 204 C302 194 298 181 298 166 C298 136 324 112 362 112 Z" fill="#FFFFFF"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
