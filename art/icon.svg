<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8558F"/>
      <stop offset="1" stop-color="#3D1236"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3D1236" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- An inbox tray, because the Control Panel already shows this addon as
       `mail-inbox-content`: the icon is the same thing a user meets in the nav.
       Not an envelope, because Marketing has that one. What makes it a
       conversation and not a mail client is the speech bubble at the corner:
       the addon threads the mailbox into conversations and answers them.

       Heather, a muted plum-rose, because the suite's pinks (Offers, Email
       Templates, Private Media) are loud and saturated, and the CRM neighbours
       (LeadHub amber, Accounts steel) are taken. -->
  <!-- shifted down-left so the tray and the bubble sit evenly in the square -->
  <g transform="translate(-14 8)">
  <g filter="url(#sh)">
    <!-- the tray -->
    <rect x="98" y="168" width="300" height="232" rx="28" fill="#FFFFFF"/>
  </g>

  <!-- two messages waiting in the tray -->
  <rect x="134" y="208" width="132" height="22" rx="11" fill="url(#bg)"/>
  <rect x="134" y="254" width="104" height="22" rx="11" fill="url(#bg)"/>

  <!-- the tray's rim. Thick on purpose: at 24 pixels this line is what says
       "inbox" rather than "card". -->
  <path d="M122 310 H190 L208 344 H288 L306 310 H374" stroke="url(#bg)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the conversation: a reply bubble, punched out of the tray's corner -->
  <path d="M362 112 C400 112 426 136 426 166 C426 196 400 220 362 220 C353 220 344 219 336 216 L304 232 L312 204 C302 194 298 181 298 166 C298 136 324 112 362 112 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="36" stroke-linejoin="round"/>
  <path d="M362 112 C400 112 426 136 426 166 C426 196 400 220 362 220 C353 220 344 219 336 216 L304 232 L312 204 C302 194 298 181 298 166 C298 136 324 112 362 112 Z" fill="#FFFFFF"/>
  </g>
</svg>
